name: CD-Prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv azure-core
      - name: Run governance unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest

  deploy-prod:
    needs: quality-and-tests
    runs-on: ubuntu-latest
    environment: prod
    env:
      ENV_NAME: prod
      RG: rg-sanitasrag-prod-chn
      ACR: acrsragprodchn8167
      API: ca-sanitasrag-api-prod-chn
      WEB: ca-sanitasrag-web-prod-chn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container Apps
        run: bash infra/deploy-containerapps.sh prod "${GITHUB_SHA}"

      - name: Summary
        if: always()
        run: |
          echo "### CD Prod" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resource group: $RG" >> "$GITHUB_STEP_SUMMARY"
          echo "- ACR: $ACR" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Approval: GitHub Environment prod" >> "$GITHUB_STEP_SUMMARY"
