name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv azure-core

      - name: Run governance unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest

      - name: Verify Dockerfiles assemble
        run: |
          python infra/docker/make_production_layout.py --src . --dest /tmp/insurancerag-layout
          test -f /tmp/insurancerag-layout/Production/backend/API_backend/backend_main_insurance.py
          test -f /tmp/insurancerag-layout/Production/frontend/frontend.py
          test -f /tmp/insurancerag-layout/governance/governance_gate.py
